name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: 'stable'

      - run: flutter --version
      - run: flutter pub cache repair
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Build Release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Generate SHA256 Debug
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee app-debug.apk.sha256

      - name: Generate SHA256 Release
        run: |
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee app-release.apk.sha256

      - name: Show SHA256 Values
        run: |
          echo "===== DEBUG APK ====="
          cat app-debug.apk.sha256

          echo "===== RELEASE APK ====="
          cat app-release.apk.sha256

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            app-debug.apk.sha256
            app-release.apk.sha256